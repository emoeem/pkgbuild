# Emo local-only high-performance makepkg profile.
# Target CPU: AMD Zen 3 (Ryzen 7 7735H).
CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now"
RUSTFLAGS="-C target-cpu=znver3 -C opt-level=3"
