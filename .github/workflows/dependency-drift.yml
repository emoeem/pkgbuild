name: Rebuild on dependency drift

on:
  schedule:
    # Every four hours: a dependency SONAME/ABI bump breaks the already
    # published packages immediately, and the rebuild can only start once this
    # detection has run. The check only compares recorded dependency versions
    # against the current repositories, so running it often is cheap.
    - cron: "43 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  detect:
    runs-on: ubuntu-24.04
    env:
      # 检测容器来自 GHCR，不是 Docker Hub：Docker Hub 的未认证拉取按 runner
      # 出口 IP 限速，共享 runner 地址随时会拿到 `toomanyrequests`（exit 125），
      # 而这个 job 用 `|| true` 兜住了容器失败，所以它不会变红——只会静悄悄地
      # 报告「没有漂移」。用本仓库自己发布的 builder 镜像，匿名拉取无凭据、无限速。
      BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch current repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p published/x86_64
          if gh release view repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download repo --repo "$GITHUB_REPOSITORY" \
              --pattern '*.pkg.tar.zst' --dir published/x86_64 --clobber
          fi

      - name: Detect direct dependency drift
        if: ${{ hashFiles('published/x86_64/*.pkg.tar.zst') != '' }}
        run: |
          set -Eeuo pipefail
          mkdir -p drift
          # Both mounts are read-only, so the detector cannot write its report
          # inside the container. Capture the container's stdout on the runner
          # instead; writing to /workspace/drift/report.txt silently produced no
          # report and reported "no drift" on every run.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/published:/published:ro" \
            --env "LOCAL_REPO_DIR=/published/x86_64" \
            "$BUILDER_IMAGE" \
            bash -c 'bash /workspace/scripts/setup-container-repos.sh || echo "WARNING: chaotic-aur unavailable, drift only covers the remaining repositories" >&2; bash /workspace/scripts/check-dependency-drift.sh /published/x86_64 /workspace' \
            > drift/report.txt || true
          cat drift/report.txt

      - name: Dispatch affected package rebuilds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(
            sed -n 's/^STALE \([^:]*\):.*/\1/p' drift/report.txt | sort -u
          )
          if (( ${#packages[@]} == 0 )); then
            echo 'No direct dependency drift detected.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          selected="$(IFS=,; echo "${packages[*]}")"
          echo "Dependency drift requires: $selected" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f packages="$selected" \
            -f make_jobs=4 \
            -f bump_pkgrel=true
