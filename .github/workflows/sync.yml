name: Sync AUR package sources

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Package names separated by commas, or all
        required: true
        default: all
        type: string
  schedule:
    - cron: "17 3 * * *"

concurrency:
  # Shared with refresh-rule-sets.yml and sync-dae-release.yml: all three
  # commit to main, so they must not race each other into non-fast-forward
  # push failures.
  group: main-branch-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Update AUR-managed packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      # Available to the notify job even when the run ends red.
      partial: ${{ steps.sync.outputs.partial }}
      failures: ${{ steps.sync.outputs.failures }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync AUR files
        id: sync
        shell: bash
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          SYNC_FAILURES_FILE: ${{ runner.temp }}/sync-failures.tsv
        run: |
          set -Eeuo pipefail
          selection="${REQUESTED_PACKAGES:-all}"
          args=()
          if [[ "$selection" != "all" ]]; then
            selection="${selection// /}"
            IFS=',' read -ra packages <<< "$selection"
            args=("${packages[@]}")
          fi
          rc=0
          # Exit 3 = partial failure: per-package isolation already kept the
          # failed packages at their committed state, so the run must go on
          # committing and dispatching the successful ones (and turn red at
          # the end). Any other non-zero exit is an environment/usage failure
          # and stops the job right here.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:/runner-temp" \
            --env SYNC_FAILURES_FILE=/runner-temp/sync-failures.tsv \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash /workspace/scripts/sync-aur-packages.sh "${args[@]}" || rc=$?
          if (( rc == 3 )); then
            {
              echo 'partial=true'
              echo 'failures<<SYNC_FAILURES_EOF'
              cat "$SYNC_FAILURES_FILE"
              echo 'SYNC_FAILURES_EOF'
            } >> "$GITHUB_OUTPUT"
          elif (( rc != 0 )); then
            exit "$rc"
          fi

      - name: Detect changed packages
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(
            git diff --name-only -- packages |
              awk -F/ '$1 == "packages" && NF >= 3 { print $2 }' |
              sort -u
          )

          if (( ${#packages[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
          else
            package_list="$(IFS=,; echo "${packages[*]}")"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "packages=$package_list" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "chore: sync AUR packages: $PACKAGES"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push

      - name: Dispatch rebuild for the synced packages
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: |
          set -Eeuo pipefail
          # A push made with GITHUB_TOKEN does not trigger other workflows, so
          # the rebuild has to be requested explicitly; without this a synced
          # AUR update sits in git until some unrelated check happens to
          # dispatch a build. Only packages whose AUR sources really changed are
          # synced, so this is not a periodic rebuild.
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f packages="$PACKAGES" \
            -f make_jobs=4
          printf 'Dispatched a rebuild for: %s\n' "$PACKAGES"

      - name: Fail the run on partial sync failures
        if: steps.sync.outputs.partial == 'true'
        shell: bash
        env:
          FAILURES: ${{ steps.sync.outputs.failures }}
        run: |
          set -Eeuo pipefail
          # Kept last on purpose: the successful packages above were already
          # committed and dispatched; this only makes the run (and its
          # failure-notification issue) reflect the isolated failures.
          printf '::error::AUR sync finished with per-package failures; successful packages were committed and dispatched. Failures:\n%s\n' "$FAILURES"
          exit 3

  notify:
    name: Notify failure or recovery
    needs: [sync]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (for the local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the failure issue
        uses: $/.github/actions/notify-failure
        with:
          title: "[CI] Sync AUR package sources failed"
          outcome: ${{ needs.sync.result == 'failure' && 'failure' || (needs.sync.result == 'success' && 'recovered' || 'none') }}
          details: ${{ needs.sync.outputs.failures }}
