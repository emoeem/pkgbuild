name: Sync AUR package sources

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Package names separated by commas, or all
        required: true
        default: all
        type: string
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: sync-aur-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Update AUR-managed packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sync AUR files
        shell: bash
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          set -Eeuo pipefail
          selection="${REQUESTED_PACKAGES:-all}"
          if [[ "$selection" == "all" ]]; then
            ./scripts/sync-aur-packages.sh
          else
            selection="${selection// /}"
            IFS=',' read -ra packages <<< "$selection"
            ./scripts/sync-aur-packages.sh "${packages[@]}"
          fi

      - name: Detect changed packages
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(
            git diff --name-only -- packages |
              awk -F/ '$1 == "packages" && NF >= 3 { print $2 }' |
              sort -u
          )

          if (( ${#packages[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
          else
            package_list="$(IFS=,; echo "${packages[*]}")"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "packages=$package_list" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "chore: sync AUR packages: $PACKAGES"
          git push
