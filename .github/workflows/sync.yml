name: Sync ffmpeg-full from AUR

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: sync-ffmpeg-full
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  sync:
    name: Update package files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync AUR files
        run: ./scripts/sync-ffmpeg-full.sh

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- packages/ffmpeg-full; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(
            awk -F ' = ' '$1 == "\tpkgver" { print $2; exit }' \
              packages/ffmpeg-full/.SRCINFO
          )"
          release="$(
            awk -F ' = ' '$1 == "\tpkgrel" { print $2; exit }' \
              packages/ffmpeg-full/.SRCINFO
          )"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ffmpeg-full
          git commit -m "chore: sync ffmpeg-full ${version}-${release}"
          git push

      - name: Start package build
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main -f make_jobs=2
