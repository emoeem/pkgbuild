name: Sync mpv-Emo tracks

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: Track to update
        required: true
        default: all
        type: choice
        options:
          - all
          - stable
          - development

permissions:
  contents: write

concurrency:
  group: mpv-track-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update mpv track pins
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Install sync tools
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Sync selected tracks
        shell: bash
        env:
          REQUESTED_TRACK: ${{ inputs.track }}
        run: |
          set -Eeuo pipefail
          ./scripts/sync-mpv-tracks.sh "${REQUESTED_TRACK:-all}"

      - name: Validate tracked package files
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/check-package.sh mpv-emo mpv-emo-git
          git diff --check

      - name: Commit mpv track updates
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- packages/mpv-emo packages/mpv-emo-git tracks/mpv; then
            echo 'No mpv track updates.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/mpv-emo packages/mpv-emo-git tracks/mpv
          git commit -m 'chore: sync mpv-Emo tracks'
          git push
