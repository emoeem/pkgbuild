name: Build private Arch repository

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Package names separated by commas, or all
        required: true
        default: all
        type: string
      build_mode:
        description: Shadow-run mode; push builds always remain legacy
        required: true
        default: legacy
        type: choice
        options:
          - legacy
          - chroot
      make_jobs:
        description: Parallel compiler jobs per package
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      bump_pkgrel:
        description: Bump pkgrel for ABI/stale replacement builds
        required: false
        default: false
        type: boolean
      allow_partial_publish:
        description: Publish successful packages even if another selected package fails
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: read
  issues: write

env:
  RELEASE_TAG: repo
  REPOSITORY_NAME: emoeem
  BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.select.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Read builder generation
        id: generation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "value=$(tr -d '[:space:]' < .github/builder/generation)" >> "$GITHUB_OUTPUT"

      - name: Build plan
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BUILDER_GENERATION: ${{ steps.generation.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p published-abi
          if gh release download repo --repo "$GITHUB_REPOSITORY" --pattern 'emoeem-abi-manifest.txt' --dir published-abi --clobber; then
            manifest_args=(--repository-manifest published-abi/emoeem-abi-manifest.txt)
          else
            echo 'No published ABI manifest found; ABI-manifest drift is unavailable for this run.' >&2
            manifest_args=()
          fi
          selection="${REQUESTED_PACKAGES:-all}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            selection="changed"
          fi
          # The planner is the single decision point: it prints why every
          # package was selected or skipped and feeds the same answer to the
          # matrix, to the DAG summary and to the failure report.
          python3 scripts/build-planner.py \
            --selection "$selection" \
            --before "${BEFORE_SHA:-}" \
            --after "$AFTER_SHA" \
            --builder-generation "$BUILDER_GENERATION" \
            "${manifest_args[@]}" \
            --out build-plan \
            --github-output "$GITHUB_OUTPUT"
          cat build-plan/plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build DAG
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build-dag.py --plan build-plan/plan.json --format text >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build plan
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: build-plan-${{ github.run_id }}
          path: build-plan/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build ${{ matrix.package }}
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    env:
      MAKE_JOBS: ${{ inputs.make_jobs || '4' }}
      BUMP_PKGREL: ${{ inputs.bump_pkgrel || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Validate package files
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: ./scripts/check-package.sh "$PACKAGE_NAME"

      - name: Download build plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-plan-${{ github.run_id }}
          path: build-plan

      - name: Wait for in-repo build prerequisites
        # The matrix starts every package at once, so ffmpeg-full could link
        # against the previous mpeghdec/quirc/svt-jpeg-xs-git while those are
        # being rebuilt in the same run. Fails open: the wait is skipped with a
        # warning if the API cannot be read.
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/wait-for-build-dependencies.sh \
            --package "$PACKAGE_NAME" \
            --run-id "${{ github.run_id }}" \
            --repository "${{ github.repository }}"

      - name: Stage freshly built in-repo prerequisites
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t deps < <(python3 -c 'import json,subprocess,sys; p=sys.argv[1]; plan=json.load(open(sys.argv[2], encoding="utf-8")); deps=json.loads(subprocess.check_output(["python3","scripts/build-dag.py","--prerequisites-for",p], text=True)); selected=set(plan.get("rebuild", [])); selected_deps=[d for d in deps if d in selected]; sys.stdout.write("\n".join(selected_deps))' "$PACKAGE_NAME" build-plan/plan.json)
          ((${#deps[@]} == 0)) && { echo 'No selected in-repository prerequisites to stage; published dependencies remain in use.'; exit 0; }
          mkdir -p staging localrepo/x86_64
          for dep in "${deps[@]}"; do
            artifact_dir="staging/$dep"
            mkdir -p "$artifact_dir"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "built-${dep}-${GITHUB_RUN_ID}" --dir "$artifact_dir"
            tar_file="$artifact_dir/$dep.tar"
            [[ -s "$tar_file" ]] || { echo "Missing prerequisite artifact payload: $tar_file" >&2; exit 1; }
            extract_dir="$artifact_dir/extracted"
            mkdir -p "$extract_dir"
            tar --extract --file "$tar_file" --directory "$extract_dir"
            mapfile -t packages < <(find "$extract_dir" -maxdepth 1 -type f -name '*.pkg.tar.zst' -print)
            ((${#packages[@]} > 0)) || { echo "No package files in prerequisite artifact: $dep" >&2; exit 1; }
            for package_file in "${packages[@]}"; do
              pkgname="$(bsdtar -xOf "$package_file" .PKGINFO | awk -F ' = ' '$1 == "pkgname" {print $2; exit}')"
              [[ -n "$pkgname" ]] || { echo "Missing pkgname in $package_file" >&2; exit 1; }
              find localrepo/x86_64 -maxdepth 1 -type f -name "${pkgname}-*.pkg.tar.zst" -delete
              cp "$package_file" localrepo/x86_64/
            done
          done
          find localrepo/x86_64 -maxdepth 1 -type f -name '*.pkg.tar.zst' -printf '%f\n' | sort

      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          # ffmpeg-full / CUDA 构建接近 hosted runner 的磁盘上限；预装的
          # 工具链这里用不到，删掉可腾出约 25 GB。
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android /opt/gradle
          df -h /

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose builder cache flavor
        id: cache-flavor
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          if [[ "$PACKAGE_NAME" == *cuda* || "$PACKAGE_NAME" == "ffmpeg-full" ]]; then
            echo "flavor=cuda" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=standard" >> "$GITHUB_OUTPUT"
          fi

      # Layered caches. Each layer has its own key so a change that only
      # affects one of them (a new source tarball vs. a new toolchain) does not
      # invalidate the others. The builder *generation* is a single file
      # (.github/builder/generation) so "the builder changed, drop the derived
      # caches" is an explicit, reviewable act instead of a side effect of
      # editing the Dockerfile.
      - name: Read builder generation
        id: generation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "value=$(tr -d '[:space:]' < .github/builder/generation)" >> "$GITHUB_OUTPUT"

      - name: Set up builder image and restore caches
        id: builder
        uses: ./.github/actions/setup-builder
        with:
          package_name: ${{ matrix.package }}
          flavor: ${{ steps.cache-flavor.outputs.flavor }}
          generation: ${{ steps.generation.outputs.value }}
          restore-caches: 'true'

      - name: Fetch current private repository packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Lives outside .cache/pkgbuild so the actions/cache snapshot only
          # ever contains the pacman/VCS/Cargo caches, never the repository
          # assets that are re-fetched here on every job. The rm below purges
          # the legacy subtree that old snapshots had already cached.
          rm -rf .cache/pkgbuild/repo
          mkdir -p localrepo/x86_64
          if gh release view repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download repo --repo "$GITHUB_REPOSITORY" --pattern "*.pkg.tar.zst" --dir localrepo/x86_64 --clobber
          fi

      - name: Build in reusable CachyOS builder
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
          REQUESTED_BUILD_MODE: ${{ inputs.build_mode || 'legacy' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          build_mode=legacy
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_BUILD_MODE" == chroot ]]; then
            build_mode=chroot
          fi
          echo "Selected build mode: $build_mode (push always uses legacy)." >> "$GITHUB_STEP_SUMMARY"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/localrepo/x86_64:/repo" \
            "$BUILDER_IMAGE" bash -lc 'shopt -s nullglob; packages=(/repo/*.pkg.tar.zst); if (( ${#packages[@]} > 0 )); then rm -f /repo/emoeem.db* /repo/emoeem.files*; repo-add --remove /repo/emoeem.db.tar.gz "${packages[@]}"; fi'
          container_security_args=()
          if [[ "$build_mode" == chroot ]]; then
            container_security_args+=(--cap-add SYS_ADMIN --security-opt seccomp=unconfined)
          fi
          docker run --rm "${container_security_args[@]}" \
            --shm-size 2g \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/dist:/out" \
            --volume "$GITHUB_WORKSPACE/.cache/pkgbuild:/cache" \
            --volume "$GITHUB_WORKSPACE/localrepo/x86_64:/localrepo:ro" \
            --volume "$GITHUB_WORKSPACE/localrepo/x86_64:/run/pkgbuild-localrepo:ro" \
            --env "LOCAL_REPO_DIR=/localrepo" \
            --env "LOCAL_REPO_MOUNT=/run/pkgbuild-localrepo" \
            --env "LOCAL_REPO_NAME=emoeem" \
            --env "CLEAN_CHROOT_BUILD=$([[ "$build_mode" == chroot ]] && echo 1 || echo 0)" \
            --env "BUILDER_GENERATION=${{ steps.generation.outputs.value }}" \
            --env "MAKE_JOBS=$MAKE_JOBS" \
            --env "BUMP_PKGREL=$BUMP_PKGREL" \
            --env "PACKAGE_NAME=$PACKAGE_NAME" \
            --env "CACHE_DIR=/cache" \
            "$BUILDER_IMAGE" \
            bash /workspace/scripts/build-in-arch.sh

      - name: Verify package artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          find dist -maxdepth 1 -type f -printf '%f %k KiB\n' | sort
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          # GitHub rejects release assets larger than 2 GiB.
          max_bytes=$((2 * 1024 * 1024 * 1024))
          while IFS= read -r -d '' package_file; do
              size_bytes="$(stat -c %s "$package_file")"
              if (( size_bytes > max_bytes )); then
                  printf \
                      '%s is %d MiB, exceeding the 2 GiB release asset size limit.\n' \
                      "$package_file" "$((size_bytes / 1048576))" >&2
                  exit 1
              fi
          done < <(
              find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' -print0
          )

      - name: Report namcap warnings
        if: success() && hashFiles('dist/namcap.txt') != '' && (github.event_name != 'workflow_dispatch' || inputs.build_mode != 'chroot')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          ignore_file="packages/$PACKAGE_NAME/.namcap-ignore"
          report="$(python3 scripts/namcap_warnings.py --package "$PACKAGE_NAME" --warnings-file dist/namcap.txt --ignore-file "$ignore_file")"
          key="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["key"])' "$report")"
          warnings="$(python3 -c 'import json,sys; print(chr(10).join(json.loads(sys.argv[1])["warnings"]))' "$report")"
          [[ -n "$key" ]] || exit 0
          issue="$(gh issue list --state open --limit 100 --json number,title | python3 -c 'import json,sys; title=sys.argv[1]; rows=json.load(sys.stdin); print(next((x["number"] for x in rows if x["title"]==title), ""))' "$key")"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          printf 'Normalized namcap warnings for %s in workflow run %s:\n\n\x60\x60\x60text\n%s\n\x60\x60\x60\n' "$PACKAGE_NAME" "$GITHUB_RUN_ID" "$warnings" > "$body_file"
          if [[ -n "$issue" ]]; then gh issue comment "$issue" --body-file "$body_file"; else gh issue create --title "$key" --body-file "$body_file"; fi

      - name: Upgrade-path dry run
        if: success() && (matrix.package == 'linuxqq-clipsync-git' || matrix.package == 'sing-box-ebpf')
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --cap-add SYS_ADMIN --security-opt seccomp=unconfined \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/dist:/out:ro" \
            --volume "$GITHUB_WORKSPACE/localrepo/x86_64:/localrepo:ro" \
            --volume "$GITHUB_WORKSPACE/.cache/pkgbuild:/cache" \
            --env "PACKAGE_NAME=$PACKAGE_NAME" \
            --env "CACHE_DIR=/cache" \
            "$BUILDER_IMAGE" bash /workspace/scripts/test-upgrade-path.sh /out /localrepo /cache

      - name: Close resolved build-failure issues
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode != 'chroot')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r issue; do
            [[ -n "$issue" ]] || continue
            number="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["number"])' "$issue")"
            title="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["title"])' "$issue")"
            [[ "$title" == "[build-failure] $PACKAGE_NAME:"* ]] || continue
            gh issue close "$number" --reason completed --comment "Build recovered for $PACKAGE_NAME in run $GITHUB_RUN_ID."
          done < <(gh issue list --state open --limit 100 --json number,title | jq -c '.[]')

      - name: Analyze build failure
        # Runs on the failing path only. Produces the structured failure record
        # and the whole artifacts/build-report/ bundle so nobody has to read a
        # multi-thousand-line log again.
        if: failure()
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          BUILD_PLAN: build-plan/plan.json
        run: |
          set -Eeuo pipefail
          mkdir -p build-report
          log="dist/build.log"
          [[ -f "$log" ]] || { log="build-report/empty.log"; : >"$log"; }
          python3 scripts/analyze-build-failure.py \
            --package "$PACKAGE_NAME" \
            --log "$log" \
            --root "$GITHUB_WORKSPACE" \
            --report-dir build-report \
            --repository-dir localrepo/x86_64 \
            --plan "$BUILD_PLAN" \
            --timings dist/timings.json \
            --out build-report/failure.json || true
          cat build-report/summary.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or update build-failure issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          failure=build-report/failure.json
          [[ -s "$failure" ]] || exit 0
          category="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["category"])' "$failure")"
          root_cause="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("root_cause") or "unclassified")' "$failure" | tr '\n' ' ' | cut -c1-100)"
          title="[build-failure] $PACKAGE_NAME: $category: $root_cause"
          issue="$(gh issue list --state open --limit 100 --json number,title | python3 -c 'import json,sys; p=sys.argv[1]; rows=json.load(sys.stdin); print(next((x["number"] for x in rows if x["title"]==p), ""))' "$title")"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Repeated failure in run $GITHUB_RUN_ID. Category: $category. Root cause: $root_cause. See build-report artifact for evidence."
          else
            body_file="$(mktemp)"
            trap 'rm -f "$body_file"' EXIT
            printf 'Package: %s\nCategory: %s\nRoot cause: %s\nRun: %s/%s/actions/runs/%s\n\nSee the uploaded build-report artifact for full logs and dependency context.\n' \
              "$PACKAGE_NAME" "$category" "$root_cause" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body_file"
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Attempt automatic repair (dry run)
        if: failure()
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          AUTO_FIX_LEVEL: ${{ vars.AUTO_FIX_LEVEL || '1' }}
        run: |
          set -Eeuo pipefail
          bash scripts/auto-repair.sh \
            --package "$PACKAGE_NAME" \
            --failure build-report/failure.json \
            --level "$AUTO_FIX_LEVEL" \
            --out build-report/repair-attempt.json \
            --audit build-report/repair-audit.jsonl || true
          cat build-report/repair-attempt.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload build report
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: build-report-${{ matrix.package }}-${{ github.run_id }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Pack package artifact
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          tar \
            --create \
            --file "artifact/${PACKAGE_NAME}.tar" \
            --directory dist \
            .
          tar --list --file "artifact/${PACKAGE_NAME}.tar"

      - name: Upload package artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: built-${{ matrix.package }}-${{ github.run_id }}
          path: artifact/${{ matrix.package }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  repair:
    name: Auto-repair failed builds
    needs:
      - select
      - build
    # Only on the failing path, and never when the run was cancelled.
    if: ${{ inputs.build_mode != 'chroot' && !cancelled() && needs.build.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: auto-repair
      cancel-in-progress: false

    steps:
      - name: Checkout source branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Download build reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: build-report-*-${{ github.run_id }}
          path: reports
          merge-multiple: false

      - name: Apply safe automatic repairs
        # The build already failed, so this step never turns a green run red.
        # A repair that is applied is committed (without [skip ci]) and the
        # resulting push triggers a fresh build; scripts/repair-budget.sh stops
        # the build -> fix -> build spiral after MAX_REPAIR_ATTEMPTS.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_FIX_LEVEL: ${{ vars.AUTO_FIX_LEVEL || '1' }}
          MAX_REPAIR_ATTEMPTS: ${{ vars.MAX_REPAIR_ATTEMPTS || '2' }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          mkdir -p state
          touch state/repair-history.jsonl
          applied=()
          for report in reports/*/; do
            failure="$report/failure.json"
            [[ -f "$failure" ]] || continue
            package="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"])' "$failure")"
            echo "::group::Repair attempt for $package"
            if ! bash scripts/repair-budget.sh \
                  --package "$package" \
                  --history state/repair-history.jsonl \
                  --max "$MAX_REPAIR_ATTEMPTS"; then
              echo "::warning::Repair budget exhausted for $package; reporting only."
              echo "::endgroup::"
              continue
            fi
            if ! bash scripts/auto-repair.sh \
                  --package "$package" \
                  --failure "$failure" \
                  --root "$GITHUB_WORKSPACE" \
                  --level "$AUTO_FIX_LEVEL" \
                  --apply \
                  --out "$report/repair-applied.json" \
                  --audit state/repair-history.jsonl; then
              echo "::warning::Automatic repair for $package did not succeed; the workspace was rolled back."
              cat "$report/repair-applied.json" 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report/repair-applied.json")"
            if [[ "$status" == "applied" ]]; then
              applied+=("$package")
            fi
            cat "$report/repair-applied.json"
            echo "::endgroup::"
          done
          if (( ${#applied[@]} == 0 )); then
            echo "No automatic repair was applied." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Automatic repairs applied"
            printf -- '- %s\n' "${applied[@]}"
            echo
            echo "A rebuild was triggered by this push."
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages state/repair-history.jsonl
          if git diff --cached --quiet; then
            echo "Repairs produced no committed change."
            exit 0
          fi
          git commit -m "fix(build): automatic repair for ${applied[*]}"
          git pull --rebase origin main
          git push origin HEAD

  publish:
    name: Publish pacman repository release
    needs:
      - select
      - build
    # Keep build -> verify -> publish atomic by default. Partial publication is
    # available only when explicitly requested for an unrelated multi-package run.
    if: ${{ inputs.build_mode != 'chroot' && (!cancelled() && needs.build.result == 'success' || (needs.build.result == 'failure' && inputs.allow_partial_publish == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: pacman-repository-release
      cancel-in-progress: false

    steps:
      - name: Checkout source branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: source

      - name: Download built packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: built-*-${{ github.run_id }}
          path: incoming
          merge-multiple: true

      - name: Extract built packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p incoming-packages
          archive_count=0
          while IFS= read -r -d '' archive; do
            archive_name="$(basename "$archive" .tar)"
            destination="incoming-packages/${archive_name}"
            mkdir -p "$destination"
            tar --extract --file "$archive" --directory "$destination"
            archive_count=$((archive_count + 1))
          done < <(
            find incoming -maxdepth 1 -type f -name '*.tar' -print0 |
              sort -z
          )

          if (( archive_count == 0 )); then
            echo "No package transport archives were downloaded." >&2
            exit 1
          fi

          find incoming-packages -type f -printf '%P %k KiB\n' | sort

      - name: Prepare signing key
        shell: bash
        env:
          REPOSITORY_PRIVATE_KEY: ${{ secrets.REPOSITORY_PRIVATE_KEY }}
        run: |
          install -m0600 /dev/null repository-key.asc
          if [[ -n "$REPOSITORY_PRIVATE_KEY" ]]; then
            printf '%s\n' "$REPOSITORY_PRIVATE_KEY" > repository-key.asc
          fi

      - name: Fetch current repository state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_DIR: published/x86_64
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          bash source/scripts/fetch-repository-state.sh

      - name: Install publication verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Verify publication inputs match source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash source/scripts/verify-publish-inputs.sh incoming-packages source

      - name: Update repository database
        shell: bash
        env:
          REPOSITORY_KEY_PASSPHRASE: ${{ secrets.REPOSITORY_KEY_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          # 密码经 0600 文件传入容器，而不是 --env（宿主机 ps 可见）。
          install -m0600 /dev/null repository-passphrase
          printf '%s' "$REPOSITORY_KEY_PASSPHRASE" > repository-passphrase
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/source:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/incoming-packages:/incoming:ro" \
            --volume "$GITHUB_WORKSPACE/published/x86_64:/repository" \
            --volume "$GITHUB_WORKSPACE/repository-key.asc:/run/secrets/repository-key.asc:ro" \
            --volume "$GITHUB_WORKSPACE/repository-passphrase:/run/secrets/repository-passphrase:ro" \
            --env "REPOSITORY_NAME=${REPOSITORY_NAME}" \
            --env "REPOSITORY_SERVER=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --env "REPOSITORY_KEY_PASSPHRASE_FILE=/run/secrets/repository-passphrase" \
            "$BUILDER_IMAGE" \
            bash /workspace/scripts/create-repository.sh
          rm -f repository-passphrase

      - name: Verify repository integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/published/x86_64:/repository:ro" \
            --volume "$GITHUB_WORKSPACE/source:/workspace:ro" \
            "$BUILDER_IMAGE" \
            bash -c 'bash /workspace/scripts/verify-repository.sh /repository'

      - name: Generate ABI manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/published/x86_64:/repository" \
            --volume "$GITHUB_WORKSPACE/source:/workspace:ro" \
            --env "REPOSITORY_NAME=${REPOSITORY_NAME}" \
            "$BUILDER_IMAGE" \
            bash /workspace/scripts/generate-abi-manifest.sh /repository

      - name: Repository install test
        # Release gate: install the freshly published packages from the
        # repository itself and run the runtime verification on the result.
        # Nothing is published unless the repository can satisfy its own
        # packages.
        shell: bash
        env:
          INSTALL_TEST_ALL: ${{ vars.INSTALL_TEST_ALL || '0' }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/published/x86_64:/repository:ro" \
            --volume "$GITHUB_WORKSPACE/incoming-packages:/incoming:ro" \
            --volume "$GITHUB_WORKSPACE/source:/workspace:ro" \
            --env "REPOSITORY_NAME=${REPOSITORY_NAME}" \
            --env "INSTALL_TEST_ALL=$INSTALL_TEST_ALL" \
            "$BUILDER_IMAGE" \
            bash /workspace/scripts/repository-install-test.sh

      - name: Publish repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_DIR: published/x86_64
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          bash source/scripts/publish-release.sh

      - name: Write back bumped pkgrel to main
        if: ${{ inputs.bump_pkgrel == true }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash source/scripts/write-back-pkgrel.sh \
            "$GITHUB_WORKSPACE/incoming-packages" "$GITHUB_WORKSPACE/source"
