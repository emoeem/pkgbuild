name: Build ffmpeg-full

on:
  workflow_dispatch:
    inputs:
      make_jobs:
        description: Parallel compiler jobs
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
  push:
    branches:
      - main
    paths:
      - "packages/ffmpeg-full/**"
      - "scripts/build-in-arch.sh"
      - "scripts/check-package.sh"
      - "scripts/install-built-package.sh"
      - ".github/workflows/build.yml"

concurrency:
  group: ffmpeg-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 package
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      MAKE_JOBS: ${{ inputs.make_jobs || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          srcinfo="packages/ffmpeg-full/.SRCINFO"
          pkgver="$(awk -F ' = ' '$1 == "\tpkgver" { print $2; exit }' "$srcinfo")"
          pkgrel="$(awk -F ' = ' '$1 == "\tpkgrel" { print $2; exit }' "$srcinfo")"
          test -n "$pkgver"
          test -n "$pkgrel"
          echo "version=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Validate repository files
        run: ./scripts/check-package.sh

      - name: Reclaim runner disk space
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Build in Arch Linux
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          docker run --rm \
            --shm-size 2g \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/dist:/out" \
            --env "MAKE_JOBS=$MAKE_JOBS" \
            docker.io/library/archlinux:base-devel \
            bash /workspace/scripts/build-in-arch.sh

      - name: Verify package artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          find dist -maxdepth 1 -type f -printf '%f %k KiB\n' | sort
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Upload private artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-full-${{ steps.package.outputs.version }}-x86_64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
