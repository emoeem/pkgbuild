name: Track upstream package versions

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: upstream-version-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull CachyOS builder
        id: builder
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest"
          if ! docker pull "$image"; then
            docker build --file .github/builder/Dockerfile --tag pkgbuild-builder:upstream .
            image=pkgbuild-builder:upstream
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Download published repository database
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .cache/published
          # 只取 db(几 KiB),不拖几百 MiB 的包文件。还没有 release 的首次
          # 运行:留空,checker 回退 PKGBUILD 基线。
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'emoeem.db' --dir .cache/published --clobber; then
            ls -la .cache/published
          else
            echo 'No published repository release yet; using PKGBUILD baselines.'
          fi

      - name: Check versions in CachyOS builder
        shell: bash
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          set -Eeuo pipefail
          mkdir -p .cache/upstream
          published_args=()
          if [[ -f .cache/published/emoeem.db ]]; then
            published_args+=(--published-db /workspace/.cache/published/emoeem.db)
          fi
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            "$BUILDER_IMAGE" \
            python3 /workspace/scripts/check-upstream-versions.py \
              --root /workspace \
              --config /workspace/.cache/upstream/sources.toml \
              --oldver /workspace/.cache/upstream/oldver.json \
              --newver /workspace/.cache/upstream/newver.json \
              --report /workspace/.cache/upstream/report.json \
              "${published_args[@]}" \
              --run
          cat .cache/upstream/report.json

      - name: Open, update or close upstream version issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/upstream-issues.jsonl"
          import json
          from pathlib import Path
          data = json.loads(Path('.cache/upstream/report.json').read_text())
          for update in data.get('updates', []):
              print(json.dumps(update))
          PY
          while IFS= read -r record; do
            [[ -n "$record" ]] || continue
            package="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["package"])' "$record")"
            current="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["current"])' "$record")"
            upstream="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["upstream"])' "$record")"
            title="[upstream] $package: $upstream available (published: $current)"
            # 按前缀找既有 issue:基线语义改过(PKGBUILD → published),前缀
            # 匹配让旧格式的 issue 继续被评论而不是孤儿化。
            issue="$(gh issue list --state open --limit 100 --json number,title --search "$package in:title" | python3 -c 'import json,sys; p=sys.argv[1]; prefix="[upstream] "+p+":"; rows=json.load(sys.stdin); print(next((str(x["number"]) for x in rows if x["title"].startswith(prefix)), ""))' "$package")"
            # printf 解释 \n(bash 双引号不会):body 里要真实换行
            body="$(printf 'Upstream version detected by nvchecker.\n\n- Package: %s\n- Published repository baseline: %s\n- Upstream: %s\n\nNo PKGBUILD was modified automatically. Review source checksums, packaging changes and rebuild impact before updating.' "$package" "$current" "$upstream")"
            if [[ -n "$issue" ]]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          done < "$RUNNER_TEMP/upstream-issues.jsonl"
          # 已解决的关闭:本轮 updates 没有的包,其 open 的 [upstream] issue
          # 视为已追平(或已发布),不再留成永久挂账。
          python3 - <<'PY' > "$RUNNER_TEMP/upstream-packages.txt"
          import json
          from pathlib import Path
          data = json.loads(Path('.cache/upstream/report.json').read_text())
          for update in data.get('updates', []):
              print(update['package'])
          PY
          while IFS= read -r issue_json; do
            [[ -n "$issue_json" ]] || continue
            number="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["number"])' "$issue_json")"
            title="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["title"])' "$issue_json")"
            package="${title#\[upstream\] }"; package="${package%%:*}"
            if ! grep -qxF "$package" "$RUNNER_TEMP/upstream-packages.txt"; then
              gh issue close "$number" --reason completed --comment "No longer reported: the published repository is current with upstream for $package (or the package left the tracked set). Closing as resolved."
            fi
          done < <(gh issue list --state open --limit 100 --json number,title --search "[upstream] in:title" | jq -c '.[]')
