name: Refresh sing-box rule-sets

# sing-box-rule-sets 的数据每天都在变（anti-AD / MetaCubeX / mihomo_yamls / 217heidai / lyc8503），
# 这里比对各个远程源的 sha256：有变化才更新 PKGBUILD 并推送，推送会触发 build.yml 重建该包；
# 没有变化就什么都不做，不浪费 CI。
#
# 频率每 2 小时（原为每日一次）：2026-10-12 的事故说明每天一次太疏。上次刷新
# （b4256a8，02:38Z）之后上游在几小时内又变了，而构建是 fail-closed（sha256sums
# 不符即失败），于是 05:54Z 起每一轮构建都失败；发布又是 all-or-nothing，一个包
# 失败会让整轮发布被 skip（当天 7 轮红）。
#
# 2026-10-20 根治：远程源的 sha256sums 改为 SKIP，构建不再因"校验和过期"失败，
# 改为在 build() 里做内容断言（非空 / SRS magic / 文本源行数下限），并把实际下载
# 到的哈希写进包内 SOURCE-HASHES.txt 供审计。本工作流保留 2 小时频率是为了让规则
# 数据保持新鲜（上游 8h~日更），不再是为了救构建。
on:
  schedule:
    # 每 2 小时的第 40 分钟（原为每日 23:40 UTC）
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Shared with sync.yml: both commit to main, so they must not race each other
  # into non-fast-forward push failures.
  group: main-branch-updates
  cancel-in-progress: false

jobs:
  refresh:
    name: Check upstream rule-set sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh rule-set sources
        id: refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/refresh-rule-sets.sh
          before="$(sha256sum packages/sing-box-rule-sets/PKGBUILD | cut -d' ' -f1)"
          ./scripts/refresh-rule-sets.sh
          after="$(sha256sum packages/sing-box-rule-sets/PKGBUILD | cut -d' ' -f1)"
          if [[ "$before" == "$after" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No upstream rule-set change."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package metadata
        if: steps.refresh.outputs.updated == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # builder 容器里有 makepkg：真正校验 PKGBUILD 与 .SRCINFO 的一致
          # 性（调度 runner 上脚本只能文本修补 .SRCINFO）。
          # --user builder：makepkg 拒绝以 root 运行（镜像里的 builder 用户
          # 与 build-in-arch.sh 用的同一个）。
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --user builder \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash /workspace/scripts/check-package.sh sing-box-rule-sets

      - name: Commit and push
        if: steps.refresh.outputs.updated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sing-box-rule-sets
          git diff --cached --quiet && { echo "Nothing staged."; exit 0; }
          git commit -m "chore(sing-box-rule-sets): refresh upstream rule-sets"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push

      - name: Trigger rebuild
        if: steps.refresh.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # GITHUB_TOKEN 发起的 push 不会触发其它 workflow，重建必须显式
          # 请求（与 sync.yml 同因同法），否则刷新只会躺在 git 里。
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f packages=sing-box-rule-sets \
            -f make_jobs=4
          printf 'Dispatched a rebuild for sing-box-rule-sets\n'
