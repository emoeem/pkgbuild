name: Maintenance

on:
  schedule:
    # Daily at 16:17 UTC, well after the 03:17 UTC AUR sync builds finish.
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  clean-artifacts:
    name: Delete stale artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Delete artifacts older than 72 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cutoff="$(date -u -d '72 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          deleted_total=0
          while :; do
            mapfile -t ids < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.created_at < \"${cutoff}\") | .id"
            )
            if (( ${#ids[@]} == 0 )); then
              break
            fi
            remaining_before="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                --jq '.total_count'
            )"
            for id in "${ids[@]}"; do
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; then
                deleted_total=$((deleted_total + 1))
              fi
            done
            remaining_after="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                --jq '.total_count'
            )"
            if (( remaining_after >= remaining_before )) || (( deleted_total > 500 )); then
              break
            fi
          done
          remaining="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.total_count'
          )"
          printf 'Deleted %s artifact(s); %s remain.\n' \
            "$deleted_total" "$remaining" >> "$GITHUB_STEP_SUMMARY"

  check-sonames:
    name: Detect outdated soname dependencies
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.dispatch.outputs.stale }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6

      - name: Fetch current repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p published/x86_64
          REPOSITORY_DIR="$GITHUB_WORKSPACE/published/x86_64" \
          RELEASE_REPOSITORY="$GITHUB_REPOSITORY" \
          RELEASE_TAG="repo" \
            bash "$GITHUB_WORKSPACE/scripts/fetch-repository-state.sh"

      - name: Compare linked sonames with current repositories
        run: |
          set -Eeuo pipefail
          mkdir -p maintenance-out
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/maintenance-out:/out" \
            docker.io/cachyos/cachyos-v3:latest \
            bash /workspace/scripts/check-repository-sonames.sh \
              /workspace/published/x86_64 /out /workspace/packages

      - name: Dispatch rebuilds for stale packages
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cat maintenance-out/report.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [[ -s maintenance-out/orphans.txt ]]; then
            {
              printf '\nPublished packages without a source package'
              printf ' (remove them from the release, they cannot be rebuilt):\n'
              sed 's/^/- /' maintenance-out/orphans.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          bash scripts/dispatch-stale-rebuilds.sh maintenance-out/stale.txt
