name: Maintenance

on:
  schedule:
    # Daily maintenance; the weekly baseline refresh runs separately on Sunday.
    - cron: "17 16 * * *"
    - cron: "27 16 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  clean-artifacts:
    name: Delete stale artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Delete artifacts older than 72 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cutoff="$(date -u -d '72 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          deleted_total=0
          while :; do
            mapfile -t ids < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.created_at < \"${cutoff}\") | .id"
            )
            if (( ${#ids[@]} == 0 )); then
              break
            fi
            remaining_before="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                --jq '.total_count'
            )"
            for id in "${ids[@]}"; do
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; then
                deleted_total=$((deleted_total + 1))
              fi
            done
            remaining_after="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                --jq '.total_count'
            )"
            if (( remaining_after >= remaining_before )) || (( deleted_total > 500 )); then
              break
            fi
          done
          remaining="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.total_count'
          )"
          printf 'Deleted %s artifact(s); %s remain.\n' \
            "$deleted_total" "$remaining" >> "$GITHUB_STEP_SUMMARY"

  refresh-chroot-baseline:
    name: Force weekly clean-chroot baseline rebuild
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '27 16 * * 0'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete cached clean-chroot baselines by generation key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t keys < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("chroot-v1-")) | .key' | sort -u)
          deleted=0
          for key in "${keys[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}" >/dev/null
            deleted=$((deleted + 1))
          done
          printf 'Weekly clean-chroot refresh: deleted %s baseline cache key(s). The next build recreates the baseline using the current builder generation/config fingerprint.\n' "$deleted" | tee -a "$GITHUB_STEP_SUMMARY"

  cache-usage:
    name: Monitor Actions cache usage
    runs-on: ubuntu-24.04
    steps:
      - name: Report cache usage and alert near the 10 GiB budget
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          usage="$(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage")"
          used="$(jq -r '.total_active_caches_size_in_bytes // 0' <<<"$usage")"
          count="$(jq -r '.total_active_caches_count // 0' <<<"$usage")"
          limit=$((10 * 1024 * 1024 * 1024))
          threshold=$((limit * 80 / 100))
          gib="$(awk -v bytes="$used" 'BEGIN {printf "%.2f", bytes/1024/1024/1024}')"
          percent=$((used * 100 / limit))
          {
            printf '\n### GitHub Actions cache usage\n\n'
            printf -- '- Active caches: %s\n- Used: %s GiB / 10 GiB assumed budget (%s%%)\n' "$count" "$gib" "$percent"
            printf '\nTop cache keys by size:\n'
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[] | [.size_in_bytes, .key, .ref] | @tsv' | sort -nr | awk -F '\t' 'NR <= 10 {printf "- %.2f GiB — %s (%s)\n", $1/1024/1024/1024, $2, $3}'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Cache usage: %s GiB, %s active caches, %s%% of the 10 GiB monitoring budget.\n' "$gib" "$count" "$percent"
          if (( used >= threshold )); then
            title='[cache-usage] GitHub Actions cache approaching 10 GiB limit'
            body="GitHub Actions cache usage is ${gib} GiB (${percent}% of the 10 GiB monitoring budget) across ${count} active caches. This report is refreshed by the daily Maintenance workflow. Review the cache-key breakdown in run ${GITHUB_RUN_ID}."
            issue="$(gh issue list --state open --limit 100 --json number,title | python3 -c 'import json,sys; title=sys.argv[1]; print(next((str(x["number"]) for x in json.load(sys.stdin) if x["title"]==title), ""))' "$title")"
            if [[ -n "$issue" ]]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            printf '\n::warning::Cache usage crossed the 80%% monitoring threshold; issue updated.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Cache usage is below the 80%% alert threshold.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  check-sonames:
    name: Detect outdated soname dependencies
    runs-on: ubuntu-24.04
    env:
      # 检测容器和 package build 用同一份 builder 镜像：它由本仓库发布到 GHCR，
      # 匿名拉取不受 Docker Hub 的「每 IP 未认证拉取」限速影响。直接拉
      # docker.io/cachyos/cachyos-v3:latest 会被限速成
      # `toomanyrequests: You have reached your unauthenticated pull rate limit`
      # （run 37989749507，docker run exit 125）——检测器本身没有任何问题，
      # 却让每天一次的 soname 复查整个 job 变红。
      BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest
    outputs:
      stale: ${{ steps.dispatch.outputs.stale }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CachyOS builder
        id: builder
        uses: ./.github/actions/setup-builder
        with:
          restore-caches: 'false'

      - name: Fetch current repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p published/x86_64
          REPOSITORY_DIR="$GITHUB_WORKSPACE/published/x86_64" \
          RELEASE_REPOSITORY="$GITHUB_REPOSITORY" \
          RELEASE_TAG="repo" \
            bash "$GITHUB_WORKSPACE/scripts/fetch-repository-state.sh"

      - name: Compare linked sonames with current repositories
        run: |
          set -Eeuo pipefail
          mkdir -p maintenance-out
          # Exit 4 means a packages/<dir>/.rebuild-on declaration no longer
          # matches the artifact (it declares a SONAME the package does not
          # NEED).  A rebuild cannot fix that, and blocking the drift rebuilds
          # below would turn a one-line metadata fix into a stopped pipeline, so
          # it is surfaced as an error annotation and the run continues.  Every
          # other non-zero exit (bad usage, unusable declarations or provider
          # set) still fails the step: those mean the report cannot be trusted.
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/maintenance-out:/out" \
            "${{ steps.builder.outputs.image }}" \
            bash /workspace/scripts/check-repository-sonames.sh \
              /workspace/published/x86_64 /out /workspace/packages
          status=$?
          set -e
          if ((status == 4)); then
            printf '::error::stale .rebuild-on declaration(s); see STALE-DECLARATION in the report above\n'
          elif ((status != 0)); then
            exit "$status"
          fi

      - name: Dispatch rebuilds for stale packages
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cat maintenance-out/report.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [[ -s maintenance-out/orphans.txt ]]; then
            {
              printf '\nPublished packages without a source package'
              printf ' (remove them from the release, they cannot be rebuilt):\n'
              sed 's/^/- /' maintenance-out/orphans.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          bash scripts/dispatch-stale-rebuilds.sh maintenance-out/stale.txt
