name: Publish CI builder image

on:
  push:
    branches: [main]
    paths:
      - ".github/builder/**"
      - "scripts/setup-build-repositories.sh"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pkgbuild-builder
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .          file: .github/builder/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest
          cache-from: type=gha,scope=pkgbuild-builder
          cache-to: type=gha,mode=max,scope=pkgbuild-builder
