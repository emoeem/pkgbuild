name: Publish CI builders

on:
  push:
    branches: [main]
    paths:
      - ".github/builder/**"
      - ".github/workflows/builder.yml"
      - "tests/test-cachyos-environment.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pkgbuild-builder
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.variant }} builder
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag: latest
            cuda: "0"
          - variant: cuda
            tag: cuda
            cuda: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read builder generation
        id: generation
        shell: bash
        run: |
          set -Eeuo pipefail
          generation="$(tr -d '[:space:]' < .github/builder/generation)"
          [[ "$generation" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid builder generation: $generation" >&2; exit 1; }
          echo "value=$generation" >> "$GITHUB_OUTPUT"
          echo "Builder generation: $generation"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 必须显式建一个 docker-container driver 的 builder：registry 缓存导出
      # （cache-to type=registry）在默认的 docker driver 上直接失败——
      # 「Cache export is not supported for the docker driver.」（run 38036057545）。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push builder image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: .github/builder/Dockerfile
          push: true
          build-args: |
            CUDA_BUILDER=${{ matrix.cuda }}
            BUILDER_GENERATION=${{ steps.generation.outputs.value }}
          tags: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:${{ matrix.tag }}
          # Registry cache instead of actions/cache: image layers are far too
          # large for the 10 GiB actions cache and would evict the build
          # caches used by build.yml.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:buildcache-${{ matrix.variant }},mode=max
      - name: Verify builder environment
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:${{ matrix.tag }}
          MODE: ${{ matrix.variant }}
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$IMAGE" \
            bash /workspace/tests/test-cachyos-environment.sh builder
          if [[ "$MODE" == cuda ]]; then
            docker run --pull always --rm \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              "$IMAGE" \
              bash /workspace/tests/test-cachyos-environment.sh cuda
          fi
