name: Publish CI builders

on:
  push:
    branches: [main]
    paths:
      - ".github/builder/**"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pkgbuild-builder
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.variant }} builder
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag: latest
            cuda: "0"
          - variant: cuda
            tag: cuda
            cuda: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push builder image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: .github/builder/Dockerfile
          push: true
          build-args: |
            CUDA_BUILDER=${{ matrix.cuda }}
          tags: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:${{ matrix.tag }}
      - name: Verify builder environment
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:${{ matrix.tag }}
          MODE: ${{ matrix.variant }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$IMAGE" \
            bash /workspace/tests/test-cachyos-environment.sh builder
          if [[ "$MODE" == cuda ]]; then
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              "$IMAGE" \
              bash /workspace/tests/test-cachyos-environment.sh cuda
          fi
