name: Track dae releases and rebuild daed

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: dae-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update dae-emo and gate daed rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update dae release metadata
        id: update
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/sync-dae-release.sh
          ./scripts/sync-dae-release.sh
          if git diff --quiet -- packages/dae-emo; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new dae release."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updated dae package
        if: steps.update.outputs.updated == 'true'
        run: ./scripts/check-package.sh dae-emo

      - name: Commit and push dae update
        if: steps.update.outputs.updated == 'true'
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dae-emo
          git commit -m "chore(dae): track upstream release"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dae_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger dae package build
        if: steps.update.outputs.updated == 'true'
        id: dae_dispatch
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started=$started" >> "$GITHUB_OUTPUT"
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f packages=dae-emo \
            -f make_jobs=2 \
            -f bump_pkgrel=false

      - name: Wait for dae package build
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: \${{ github.token }}
          STARTED: \${{ steps.dae_dispatch.outputs.started }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=""
          for attempt in $(seq 1 90); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= $ENV.STARTED) | .databaseId' 2>/dev/null | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          [[ -n "$run_id" ]] || {
            echo "Timed out waiting for the dae build workflow." >&2
            exit 1
          }
          echo "dae build run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Trigger daed rebuild
        if: steps.update.outputs.updated == 'true'
        id: daed_dispatch
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started=$started" >> "$GITHUB_OUTPUT"
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f packages=daed-emo \
            -f make_jobs=2 \
            -f bump_pkgrel=false

      - name: Wait for daed rebuild
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: \${{ github.token }}
          STARTED: \${{ steps.daed_dispatch.outputs.started }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=""
          for attempt in $(seq 1 90); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= $ENV.STARTED) | .databaseId' 2>/dev/null | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          [[ -n "$run_id" ]] || {
            echo "Timed out waiting for the daed rebuild workflow." >&2
            exit 1
          }
          echo "daed build run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report successful update
        if: steps.update.outputs.updated == 'true'
        run: |
          {
            echo "## dae → daed update completed"
            echo
            echo "- dae-emo metadata updated and its package build passed."
            echo "- daed-emo rebuild ran only after dae-emo passed."
            echo "- The existing pacman repository publisher handled artifact publication."
          } >> "$GITHUB_STEP_SUMMARY"
