name: Check Arch packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names to validate"
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/builder/**"
      - ".github/workflows/check.yml"
      # tests/test_workflow_images.py asserts invariants of these two, so an
      # edit to either one must re-run it.
      - ".github/workflows/dependency-drift.yml"
      - ".github/workflows/maintenance.yml"

permissions:
  contents: read

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Select changed packages
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            selection="${{ inputs.packages }}"
            packages="$(python scripts/select-packages.py --selection "$selection")"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              before="${{ github.event.pull_request.base.sha }}"
            else
              before="$BEFORE_SHA"
            fi
            packages="$(python scripts/select-packages.py --selection changed --before "$before" --after "$AFTER_SHA")"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  integration:
    name: Repository and build-graph integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Run dependency graph tests
        run: python tests/test_select_packages.py
      - name: Run ELF SONAME fault-injection test
        run: bash tests/test_elf_soname.sh
      - name: Run workflow image tests
        run: python tests/test_workflow_images.py
      # Manifest policy runs before any container is pulled: a package that
      # declares no update source, or whose metadata cannot be parsed, should
      # fail in seconds on the bare runner instead of minutes into a job.
      - name: Check package manifest policy
        run: python3 scripts/check-package-manifests.py
      - name: Run package manifest tests
        run: python3 tests/test_package_manifests.py
      - name: Run package audit in prepared builder
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash -c 'set -Eeuo pipefail; useradd --create-home checker; runuser -u checker -- env HOME=/home/checker AUDIT_ROOT=/workspace bash -c "cd /workspace && ./scripts/audit-packages.sh && ./tests/test-package-audit.sh"'
      - name: Run repository integration tests in CachyOS-v3
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            docker.io/cachyos/cachyos-v3:latest \
            bash -c 'cd /workspace && bash tests/test_repository.sh'

  check:
    name: Validate ${{ matrix.package }}
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Run CachyOS package checks
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env "PACKAGE_NAME=$PACKAGE_NAME" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash -c '
              set -Eeuo pipefail
              bash /workspace/tests/test-cachyos-environment.sh builder
              useradd --create-home checker
              runuser -u checker -- env HOME=/home/checker PACKAGE_NAME="$PACKAGE_NAME" \
                bash -c "
                  set -Eeuo pipefail
                  cd /workspace
                  ./scripts/check-package.sh \"\$PACKAGE_NAME\"
                  shellcheck --severity=warning manage.sh scripts/*.sh client/*.sh tests/*.sh
                  PYTHONPYCACHEPREFIX=/tmp/pycache python -m py_compile scripts/select-packages.py scripts/check-package-manifests.py tests/test_select_packages.py tests/test_package_manifests.py tests/test_workflow_images.py
                  namcap \"packages/\$PACKAGE_NAME/PKGBUILD\"
                "
            '
