name: Check Arch packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names to validate"
        required: true
        type: string
  pull_request:
    paths:
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "client/**"
      - "manage.sh"
      - ".github/builder/**"
      - ".github/workflows/check.yml"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "client/**"
      - "manage.sh"
      - ".githooks/**"
      - ".github/builder/**"
      - ".github/workflows/check.yml"
      # tests/test_workflow_images.py asserts invariants of these two, so an
      # edit to either one must re-run it.
      - ".github/workflows/dependency-drift.yml"
      - ".github/workflows/maintenance.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Select changed packages
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            packages="$(python scripts/select-packages.py --selection "$REQUESTED_PACKAGES")"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              before="$PR_BASE_SHA"
            else
              before="$BEFORE_SHA"
            fi
            packages="$(python scripts/select-packages.py --selection changed --before "$before" --after "$AFTER_SHA")"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  integration:
    name: Repository and build-graph integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      # The static half of this job is one script, and it is the same script the
      # git pre-commit hook runs (.githooks/pre-commit): "green locally" and
      # "green in CI" are the same list of checks, by construction. It also
      # runs before any container is pulled, so a package with no update source
      # or an unparsable .SRCINFO fails in seconds instead of minutes into a
      # job. Add checks to scripts/run-static-checks.sh, not here.
      - name: Run static checks
        run: bash scripts/run-static-checks.sh
      # Guards that equivalence: the check list, failure propagation, and the
      # hook/CI wiring itself.
      - name: Run static check harness tests
        run: bash tests/test-static-checks.sh
      # Lint lives here, not in the per-package matrix: it does not depend on
      # the selected packages, and the matrix is skipped entirely when a
      # scripts-only change selects no packages.
      - name: Run the full verification suite in the builder
        # tests/run-all.sh is the same entry point used locally, so the local
        # and CI definitions of "verified" cannot drift apart.
        #
        # 先复制一份再跑，而不是直接在只读挂载里跑：容器默认是 root，而
        # /workspace 的属主是 runner（uid 1001），git 会拒绝以 root 操作别人的
        # 仓库（fatal: detected dubious ownership in repository），凡是问 git 的
        # 检查（tests/test_workflow_references.py 的 `git ls-files`、manifest 门禁
        # 的 workflow 跟踪校验）都会假失败。复制到 /tmp/ws 后属主与运行用户一致，
        # 顺带解掉只读挂载对测试夹具的限制。挂载仍然保持只读：源仓库不会被改。
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash -c 'set -Eeuo pipefail; cp -a /workspace /tmp/ws && cd /tmp/ws && bash tests/run-all.sh'

      - name: Verify CI script references are tracked
        # Runs on the runner (not in the container) because it asks git what the
        # commit contains. A workflow that calls an uncommitted helper fails at
        # release time, which is the most expensive possible place to find out.
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPYCACHEPREFIX=/tmp/pycache python3 tests/test_workflow_references.py
      - name: Run builder environment checks
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash /workspace/tests/test-cachyos-environment.sh builder
      - name: Run build regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash /workspace/tests/test-build-regressions.sh
      - name: Run package audit in prepared builder
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash -c 'set -Eeuo pipefail; useradd --create-home checker; runuser -u checker -- env HOME=/home/checker AUDIT_ROOT=/workspace bash -c "cd /workspace && ./scripts/audit-packages.sh && ./tests/test-package-audit.sh"'
      - name: Run repository integration tests in CachyOS-v3
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            docker.io/cachyos/cachyos-v3:latest \
            bash -c 'cd /workspace && bash tests/test_repository.sh'

  check:
    name: Validate ${{ matrix.package }}
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Run CachyOS package checks
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -Eeuo pipefail
          docker run --pull always --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env "PACKAGE_NAME=$PACKAGE_NAME" \
            ghcr.io/${{ github.repository_owner }}/pkgbuild-builder:latest \
            bash -c '
              set -Eeuo pipefail
              useradd --create-home checker
              runuser -u checker -- env HOME=/home/checker PACKAGE_NAME="$PACKAGE_NAME" \
                bash -c "
                  set -Eeuo pipefail
                  cd /workspace
                  ./scripts/check-package.sh \"\$PACKAGE_NAME\"
                  namcap \"packages/\$PACKAGE_NAME/PKGBUILD\"
                "
            '
