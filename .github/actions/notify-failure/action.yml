name: Notify CI failure or recovery
description: >-
  Keep exactly one open GitHub issue per failing workflow (idempotent by exact
  issue title, the lilac "failure mail to the maintainer" analogue for this
  repository), and close it with a recovery comment once a run succeeds. Runs
  on plain `gh` — no third-party action, no extra token.
inputs:
  title:
    description: Issue title; the exact string is the idempotency key
    required: true
  outcome:
    description: >-
      failure = open the issue (or append a comment to the open one);
      recovered = close the open issue; anything else = no-op
    required: true
  details:
    description: Optional failure details (multi-line) shown in a collapsible block
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Update the failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_TITLE: ${{ inputs.title }}
        OUTCOME: ${{ inputs.outcome }}
        DETAILS: ${{ inputs.details }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW_NAME: ${{ github.workflow }}
      run: |
        set -Eeuo pipefail
        label="ci-failure"

        # The label is the lookup key for idempotency; creating it is
        # idempotent-hostile on purpose (`|| true` for the "already exists"
        # case) so the first failure and every later one behave the same.
        gh label create "$label" --repo "$GITHUB_REPOSITORY" \
            --color D93F0B \
            --description "A scheduled workflow keeps failing" \
            > /dev/null 2>&1 || true

        find_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" \
                --limit 200 --json number,title \
                | jq -r --arg title "$ISSUE_TITLE" \
                    '.[] | select(.title == $title) | .number' \
                | head -1
        }

        if [[ "$OUTCOME" == "recovered" ]]; then
            number="$(find_issue)"
            if [[ -n "$number" ]]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                    --comment "Recovered in run $RUN_URL."
                printf 'Closed recovered failure issue #%s\n' "$number"
            else
                printf 'No open failure issue matches %s; nothing to close.\n' "$ISSUE_TITLE"
            fi
            exit 0
        fi

        if [[ "$OUTCOME" != "failure" ]]; then
            printf 'Outcome is %s; nothing to do.\n' "$OUTCOME"
            exit 0
        fi

        body_file="$RUNNER_TEMP/issue-body.md"
        {
            printf '%s\n\n' "**$WORKFLOW_NAME** failed."
            printf 'Run: %s\n' "$RUN_URL"
            if [[ -n "$DETAILS" ]]; then
                printf '\n<details><summary>Failure details</summary>\n\n```text\n%s\n```\n</details>\n' "$DETAILS"
            fi
        } > "$body_file"

        number="$(find_issue)"
        if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            printf 'Commented on the existing failure issue #%s\n' "$number"
        else
            gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" --body-file "$body_file" --label "$label"
            printf 'Opened a new failure issue\n'
        fi
