[honk-core-bin]
# AUR is the update path: scripts/sync-aur-packages.sh clones the AUR repo daily
# and .aur-commit records what was imported. This entry only makes the daily
# upstream-check job report a GitHub release that the AUR maintainer has not
# packaged yet, so a stalled AUR bump shows up as an issue instead of as a
# silently stale binary in the repository.
#
# Tag naming upstream alternates between v0.0.1.beta.NN and v0.1.0-beta.N;
# both are normalized to the pkgver spelling AUR uses (0.1.0beta.4), and the
# debug-* diagnostic tags are excluded so they never look like a release.
source = "github"
github = "daeuniverse/honk"
use_max_tag = true
prefix = "v"
include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+([.-]beta\.[0-9]+)?$'
from_pattern = '^([0-9]+\.[0-9]+\.[0-9]+)[.-]beta\.([0-9]+)$'
to_pattern = '\1beta.\2'
