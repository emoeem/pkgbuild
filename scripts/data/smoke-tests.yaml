# Smoke tests and expected payloads per package.
#
# A successful makepkg run only proves that a package file exists. These
# entries prove that the artifact is *usable*: the expected binaries are
# installed, executable, and start. Commands must be non-interactive, must not
# need a display, and must exit 0 quickly.
#
# Consumed by scripts/runtime-verify.sh.

defaults:
  timeout_seconds: 30

packages:
  ffmpeg-full:
    binaries:
      - ffmpeg
      - ffprobe
    commands:
      - "ffmpeg -version"
      - "ffprobe -version"
    timeout_seconds: 60
  mpeghdec:
    # 上游装的是 mpeghDecoder / mpeghUiManager,不是 mpeghdec（2026-10-11 实测）
    binaries:
      - mpeghDecoder
    allow_failure: true
  quirc:
    libraries:
      - libquirc.so
  xclip-git:
    binaries:
      - xclip
    commands:
      - "xclip -version"
    timeout_seconds: 20
  sing-box-ebpf:
    binaries:
      - sing-box
    commands:
      - "sing-box version"
  sing-box-panel:
    # 包内安装名是 sing-box-panel（源文件叫 singbox-panel,装到 /usr/bin 时改了名）
    binaries:
      - sing-box-panel
  svt-jpeg-xs-git:
    libraries:
      - libSvtJpegxs.so
  vapoursynth-plugin-mlrt-ncnn-runtime:
    libraries:
      - libvsmodel.so
  linuxqq-wayland-fix-git:
    libraries:
      - libclipsync.so
  scx-scheds-git:
    # 上游调度器名单随版本变动（scx_central 已被移除），选一个长期存在的做代表
    binaries:
      - scx_bpfland
    allow_failure: true
  linuxqq-clipsync-git:
    note: "transitional meta package: no payload of its own"
  sing-box-rule-sets:
    note: "rule-set data package: no executable payload"
